spring:
  application:
    name: QuanLyHopDong
  datasource:
    url: "jdbc:mysql://localhost:3306/CRMOnline_Pro?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8"
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
